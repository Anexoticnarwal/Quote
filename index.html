<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Knowledge</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.05); --accent: #00d2ff; --bg: #010103; }
        
        body, html {
            margin: 0; padding: 0; background: var(--bg); height: 100vh;
            scroll-snap-type: y mandatory; overflow-y: scroll;
            font-family: 'Inter', system-ui, -apple-system, sans-serif; color: #fff;
            scrollbar-width: none;
        }

        /* Ambient Background */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #010103 100%);
            z-index: -1;
        }

        nav {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(25px); padding: 5px; border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1); display: flex;
        }

        nav button {
            background: transparent; border: none; color: #fff; padding: 10px 18px;
            border-radius: 40px; cursor: pointer; font-size: 0.7rem; font-weight: 800;
            transition: 0.3s; opacity: 0.4; letter-spacing: 1px;
        }

        nav button.active { background: var(--accent); color: #000; opacity: 1; }

        section { height: 100vh; width: 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; }

        .glass-card { 
            width: 92vw; height: 86vh; background: var(--glass); 
            backdrop-filter: blur(50px); border-radius: 40px; border: 1px solid rgba(255,255,255,0.1); 
            overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit;
        }

        .media-box { height: 40%; width: 100%; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .media-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .data-content { flex: 1; padding: 30px; background: rgba(5, 5, 10, 0.8); overflow-y: auto; }
        
        .edu-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        h2 { margin: 0; font-size: 1.3rem; color: var(--accent); line-height: 1.2; flex: 1; }
        .edu-badge { font-size: 0.6rem; background: var(--accent); color: #000; padding: 4px 10px; border-radius: 4px; font-weight: 900; margin-left: 10px; white-space: nowrap; }

        .tag-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .tag { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 2px; padding: 4px 10px; background: rgba(255,255,255,0.1); border-radius: 4px; color: #fff; opacity: 0.7; }

        .knowledge-section { margin-bottom: 20px; border-left: 2px solid var(--accent); padding-left: 15px; }
        .knowledge-label { font-size: 0.65rem; color: var(--accent); font-weight: 800; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .description { font-size: 0.95rem; line-height: 1.6; color: #e2e8f0; }
        
        .source-footer { margin-top: auto; font-size: 0.7rem; color: var(--accent); font-weight: 700; display: flex; justify-content: space-between; align-items: center; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); }

        .loader { position: fixed; bottom: 30px; width: 100%; text-align: center; opacity: 0.4; font-size: 9px; letter-spacing: 4px; z-index: 5; pointer-events: none; }
    </style>
</head>
<body>

    <nav id="topicMenu">
        <button class="active" onclick="switchTopic('space', this)">COSMOS</button>
        <button onclick="switchTopic('nature', this)">BIOLOGY</button>
        <button onclick="switchTopic('history', this)">HISTORY</button>
    </nav>

    <div id="status" class="loader">DECODING REPOSITORY...</div>
    <div id="feed"></div>

    <script>
        const feed = document.getElementById('feed');
        const status = document.getElementById('status');
        let currentTopic = 'space';
        let isLoading = false;

        const sources = {
            space: {
                async fetch() {
                    const terms = ['Hubble', 'Exoplanet', 'Supernova', 'Black Hole'];
                    const q = terms[Math.floor(Math.random()*terms.length)];
                    const res = await fetch(`https://images-api.nasa.gov/search?q=${q}&media_type=image`);
                    const d = await res.json();
                    const item = d.collection.items[Math.floor(Math.random()*15)];
                    if (!item) return null;
                    return {
                        title: item.data[0].title,
                        img: item.links[0].href,
                        badge: "ASTRONOMY",
                        label: "SCIENTIFIC CONTEXT",
                        desc: item.data[0].description.split('. ').slice(0, 4).join('. ') + '.',
                        link: `https://images.nasa.gov/details-${item.data[0].nasa_id}`,
                        tag: "NASA DATASET"
                    };
                }
            },
            nature: {
                async fetch() {
                    const res = await fetch(`https://www.fishwatch.gov/api/species`);
                    const d = await res.json();
                    const item = d[Math.floor(Math.random() * d.length)];
                    return {
                        title: item['Species Name'],
                        img: item['Species Images'] ? item['Species Images'][0]?.src : null,
                        badge: "BIOLOGY",
                        label: "SPECIES INSIGHT",
                        desc: `<b>Habitat:</b> ${item['Habitat'] ? item['Habitat'].replace(/<[^>]*>/g, '').substring(0, 150) : 'Oceanic'}. <br><br><b>Biology:</b> ${item['Biology'] ? item['Biology'].replace(/<[^>]*>/g, '').substring(0, 300) : 'Marine life details.'}...`,
                        link: `https://www.fishwatch.gov/profiles/${item['Species Name'].toLowerCase().replace(/ /g, '-')}`,
                        tag: "NOAA FISHERIES"
                    };
                }
            },
            history: {
                async fetch() {
                    const id = Math.floor(Math.random() * 480000) + 1;
                    const res = await fetch(`https://collectionapi.metmuseum.org/public/collection/v1/objects/${id}`);
                    const d = await res.json();
                    if (!d.primaryImageSmall || !d.title) return null;
                    return {
                        title: d.title,
                        img: d.primaryImageSmall,
                        badge: "HISTORY",
                        label: "HISTORICAL SIGNIFICANCE",
                        desc: `This artifact originates from the ${d.culture || 'World'} culture, dated approximately to ${d.objectDate || 'Unknown'}. It was crafted using ${d.medium || 'traditional materials'} and belongs to the ${d.department} collection.`,
                        link: d.objectURL,
                        tag: "MET ARCHIVE"
                    };
                }
            }
        };

        async function createSlide() {
            if (isLoading) return;
            isLoading = true;
            status.style.display = 'block';

            try {
                let data = null;
                while (!data) { data = await sources[currentTopic].fetch(); }

                const section = document.createElement('section');
                section.innerHTML = `
                    <a href="${data.link}" target="_blank" class="glass-card">
                        <div class="media-box">
                            <img src="${data.img}" loading="lazy" onerror="this.src='https://via.placeholder.com/800x400/000/fff?text=Source+Image'">
                        </div>
                        <div class="data-content">
                            <div class="edu-header">
                                <h2>${data.title}</h2>
                                <span class="edu-badge">${data.badge}</span>
                            </div>
                            <div class="tag-row">
                                <span class="tag">${data.tag}</span>
                            </div>
                            <div class="knowledge-section">
                                <span class="knowledge-label">${data.label}</span>
                                <div class="description">${data.desc}</div>
                            </div>
                            <div class="source-footer">
                                <span>TAP TO LEARN MORE</span>
                                <span>VERIFIED SOURCE →</span>
                            </div>
                        </div>
                    </a>
                `;
                feed.appendChild(section);
            } catch (err) { console.warn("Retrying fetch..."); } 
            finally { isLoading = false; status.style.display = 'none'; }
        }

        function switchTopic(topic, btn) {
            currentTopic = topic;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            feed.innerHTML = '';
            window.scrollTo(0, 0);
            init();
        }

        async function init() { for (let i = 0; i < 3; i++) await createSlide(); }

        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 800) createSlide();
        });

        init();
    </script>
</body>
</html>
