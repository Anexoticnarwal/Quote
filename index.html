<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Cosmos Immersive</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.1); --glass-border: rgba(255, 255, 255, 0.2); }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; color: #fff; font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden; touch-action: none;
        }

        /* Full Screen Image Background */
        #bg-image {
            position: absolute; width: 100%; height: 100%;
            object-fit: cover; filter: brightness(0.6) blur(5px);
            transition: opacity 0.8s ease-in-out;
        }

        #app-container {
            position: relative; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            perspective: 1200px; z-index: 2;
        }

        /* The 3D Glass Tile */
        .glass-tile {
            width: 88vw; height: 75vh;
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transition: transform 0.1s linear, opacity 0.4s ease;
            transform-style: preserve-3d;
        }

        .main-img {
            width: 100%; height: 100%; object-fit: cover;
            pointer-events: none;
        }

        /* Floating Info Overlay */
        .header-info {
            position: absolute; top: 20px; left: 20px; right: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .header-info h1 { margin: 0; font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
        .header-info p { margin: 5px 0 0; font-size: 0.8rem; opacity: 0.8; text-transform: uppercase; }

        /* Sleek Pull-Up Drawer */
        #drawer {
            position: absolute; bottom: -60%; left: 0; width: 100%; height: 70%;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            border-radius: 30px 30px 0 0;
            padding: 20px; box-sizing: border-box;
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 10;
        }
        .drawer-handle {
            width: 40px; height: 5px; background: rgba(255,255,255,0.3);
            border-radius: 10px; margin: 0 auto 20px;
        }
        .drawer-content { height: 100%; overflow-y: auto; padding-bottom: 40px; }
        .drawer-content h2 { font-size: 1.2rem; margin-top: 0; color: #4fc3f7; }
        .drawer-content p { font-size: 0.95rem; line-height: 1.6; opacity: 0.9; }

        /* Loading Spinner */
        .loader {
            position: absolute; border: 3px solid transparent; border-top: 3px solid #fff;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <img id="bg-image" src="">

    <div id="app-container">
        <div id="loader" class="loader"></div>
        <div id="main-tile" class="glass-tile" style="opacity: 0;">
            <div class="header-info">
                <p id="space-date"></p>
                <h1 id="space-title"></h1>
            </div>
            <img id="space-img" class="main-img" src="">
        </div>
    </div>

    <div id="drawer">
        <div class="drawer-handle" id="handle"></div>
        <div class="drawer-content">
            <h2 id="desc-title">About this view</h2>
            <p id="space-desc"></p>
            <button onclick="toggleDrawer()" style="background:none; border: 1px solid #fff; color:#fff; padding:10px; border-radius:5px; width:100%;">Close Details</button>
        </div>
    </div>

    <script>
        const tile = document.getElementById('main-tile');
        const bgImg = document.getElementById('bg-image');
        const spaceImg = document.getElementById('space-img');
        const titleEl = document.getElementById('space-title');
        const dateEl = document.getElementById('space-date');
        const descEl = document.getElementById('space-desc');
        const drawer = document.getElementById('drawer');
        const loader = document.getElementById('loader');

        let startX = 0, currentX = 0, isDrawerOpen = false;

        async function fetchSpace() {
            loader.style.display = 'block';
            tile.style.opacity = '0';
            const randomDate = new Date(2016, 0, 1).getTime() + Math.random() * (new Date().getTime() - new Date(2016,0,1).getTime());
            const dateStr = new Date(randomDate).toISOString().split('T')[0];
            
            try {
                const res = await fetch(`https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&date=${dateStr}`);
                const data = await res.json();
                if(data.media_type !== 'image') return fetchSpace();

                spaceImg.src = data.url;
                bgImg.src = data.url;
                titleEl.innerText = data.title;
                dateEl.innerText = data.date;
                descEl.innerText = data.explanation;

                spaceImg.onload = () => {
                    loader.style.display = 'none';
                    tile.style.opacity = '1';
                };
            } catch (e) { fetchSpace(); }
        }

        function toggleDrawer() {
            isDrawerOpen = !isDrawerOpen;
            drawer.style.transform = isDrawerOpen ? 'translateY(-60%)' : 'translateY(0)';
        }

        // 3D Tilt & Swipe Logic
        tile.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            tile.style.transition = 'none';
        });

        tile.addEventListener('touchmove', e => {
            currentX = e.touches[0].clientX - startX;
            const rotateY = currentX / 10;
            const rotateX = (e.touches[0].clientY - window.innerHeight/2) / -20;
            tile.style.transform = `translateX(${currentX}px) rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;
            tile.style.opacity = 1 - (Math.abs(currentX) / 700);
        });

        tile.addEventListener('touchend', () => {
            if (Math.abs(currentX) > 120) {
                tile.style.transition = 'transform 0.5s ease-in, opacity 0.3s';
                tile.style.transform = `translateX(${currentX > 0 ? 800 : -800}px) rotateY(${currentX/5}deg)`;
                setTimeout(() => { fetchSpace(); }, 300);
            } else {
                tile.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s';
                tile.style.transform = 'rotateY(0) rotateX(0) translateX(0)';
                tile.style.opacity = '1';
                // If it was just a tap (low movement), toggle drawer
                if (Math.abs(currentX) < 5) toggleDrawer();
            }
            currentX = 0;
        });

        fetchSpace();
    </script>
</body>
</html>
