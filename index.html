<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>NASA Space Swipe</title>
    
    <style>
        :root { --bg: #0b0d17; --card: #161b22; --text: #e6edf3; --accent: #4fc3f7; }
        
        body { 
            background-color: var(--bg); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; overflow: hidden; 
            touch-action: none; 
        }
        
        #card-container { position: relative; width: 85vw; max-width: 380px; height: 580px; perspective: 1000px; }
        
        .card {
            position: absolute; width: 100%; height: 100%; background: var(--card);
            border-radius: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            display: flex; flex-direction: column; padding: 12px; box-sizing: border-box;
            border: 1px solid #30363d; transition: transform 0.1s linear;
            will-change: transform; /* Boosts performance on mobile */
        }

        .img-container { width: 100%; height: 65%; border-radius: 20px; overflow: hidden; background: #000; position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .info { padding: 15px 5px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .title { font-size: 1.1rem; font-weight: bold; color: var(--accent); line-height: 1.3; }
        .date { font-size: 0.85rem; opacity: 0.5; margin-top: 5px; }
        
        .btn-view {
            background: #238636; color: white; border: none; padding: 14px;
            border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer;
            margin-top: 10px; font-size: 0.9rem;
        }

        .loader { 
            border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--accent); 
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; 
            position: absolute; top: 50%; left: 50%; margin: -20px 0 0 -20px; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div style="margin-bottom: 15px; font-size: 0.75rem; letter-spacing: 2px; opacity: 0.6;">NASA DAILY EXPLORER</div>

    <div id="card-container">
        <div id="space-card" class="card">
            <div id="loader" class="loader"></div>
            <div id="content" style="visibility:hidden; height: 100%; display: flex; flex-direction: column;">
                <div class="img-container">
                    <img id="space-img" src="" alt="NASA Space Data">
                </div>
                <div class="info">
                    <div>
                        <div id="space-title" class="title">Loading Galaxy...</div>
                        <div id="space-date" class="date"></div>
                    </div>
                    <button class="btn-view" id="view-btn">View Full Image</button>
                </div>
            </div>
        </div>
    </div>

    <div style="margin-top: 20px; font-size: 0.7rem; opacity: 0.3;">SWIPE TO TRAVEL IN TIME</div>

    <script>
        const card = document.getElementById('space-card');
        const imgEl = document.getElementById('space-img');
        const titleEl = document.getElementById('space-title');
        const dateEl = document.getElementById('space-date');
        const loader = document.getElementById('loader');
        const content = document.getElementById('content');
        const viewBtn = document.getElementById('view-btn');

        let startX = 0;
        let currentX = 0;

        // Generates a random date between 2015 and today
        function getRandomDate() {
            const start = new Date(2015, 0, 1);
            const end = new Date();
            const date = new Date(start.getTime() + Math.random() * (end.getTime() - start.getTime()));
            return date.toISOString().split('T')[0];
        }

        async function fetchSpace() {
            loader.style.display = 'block';
            content.style.visibility = 'hidden';
            
            const randomDate = getRandomDate();
            const url = `https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&date=${randomDate}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // If it's a video, just try again for an image
                if(data.media_type !== 'image') return fetchSpace();

                imgEl.src = data.url;
                titleEl.innerText = data.title;
                dateEl.innerText = data.date;
                
                viewBtn.onclick = () => window.open(data.hdurl || data.url, '_blank');

                imgEl.onload = () => {
                    loader.style.display = 'none';
                    content.style.visibility = 'visible';
                };
            } catch (err) {
                titleEl.innerText = "System Offline";
                loader.style.display = 'none';
            }
        }

        // Handle the Touch Physics
        card.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            card.style.transition = 'none';
        });

        card.addEventListener('touchmove', e => {
            currentX = e.touches[0].clientX - startX;
            let rotation = currentX / 12;
            card.style.transform = `translateX(${currentX}px) rotate(${rotation}deg)`;
        });

        card.addEventListener('touchend', () => {
            if (Math.abs(currentX) > 120) {
                // Swipe Out Animation
                card.style.transition = 'transform 0.5s ease-in, opacity 0.3s';
                card.style.transform = `translateX(${currentX > 0 ? 1000 : -1000}px) rotate(${currentX / 5}deg)`;
                card.style.opacity = '0';
                
                // Fetch New Data and Reset
                setTimeout(() => {
                    fetchSpace();
                    card.style.transition = 'none';
                    card.style.transform = 'scale(0.8)';
                    card.style.opacity = '1';
                    setTimeout(() => {
                        card.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                        card.style.transform = 'scale(1)';
                    }, 50);
                }, 300);
            } else {
                // Snap Back
                card.style.transition = 'transform 0.3s ease-out';
                card.style.transform = 'translateX(0) rotate(0)';
            }
            currentX = 0;
        });

        // Load the first image
        fetchSpace();
    </script>
</body>
</html>
