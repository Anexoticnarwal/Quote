<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Knowledge Feed</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.08); --accent: #4fc3f7; --bg: #050508; }
        
        body, html {
            margin: 0; padding: 0; background: var(--bg); height: 100vh;
            scroll-snap-type: y mandatory; overflow-y: scroll;
            font-family: -apple-system, sans-serif; color: #fff;
        }

        /* Fixed Navigation */
        nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(20, 20, 25, 0.7);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 5px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; gap: 5px;
        }

        nav button {
            background: transparent; border: none; color: #fff; padding: 8px 16px;
            border-radius: 40px; cursor: pointer; font-size: 0.7rem; font-weight: 700;
            transition: 0.3s; opacity: 0.5;
        }

        nav button.active { background: var(--accent); color: #000; opacity: 1; }

        section { height: 100vh; width: 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; }

        .glass-card { 
            width: 90vw; height: 82vh; background: var(--glass); 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 40px; border: 1px solid rgba(255,255,255,0.1); 
            overflow: hidden; display: flex; flex-direction: column; 
            box-shadow: 0 40px 80px rgba(0,0,0,0.7); margin-top: 20px;
        }

        .img-container { height: 50%; width: 100%; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }

        .data-drawer { flex: 1; padding: 25px; background: rgba(10, 10, 15, 0.85); overflow-y: auto; border-top: 1px solid rgba(255,255,255,0.1); }
        h2 { margin: 0; font-size: 1.2rem; color: var(--accent); line-height: 1.3; }
        .tag { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5; margin: 8px 0 15px; }
        .text { font-size: 0.9rem; line-height: 1.6; color: #ccc; }

        .loader { position: fixed; bottom: 40px; width: 100%; text-align: center; opacity: 0.4; font-size: 10px; letter-spacing: 3px; pointer-events: none; }
    </style>
</head>
<body>

    <nav id="topicMenu">
        <button class="active" onclick="switchTopic('science', this)">WELLCOME</button>
        <button onclick="switchTopic('history', this)">SMITHSONIAN</button>
        <button onclick="switchTopic('nasa', this)">NASA SEARCH</button>
    </nav>

    <div id="status" class="loader">RETRIEVING EDUCATIONAL RECORD...</div>
    <div id="feed"></div>

    <script>
        const feed = document.getElementById('feed');
        const status = document.getElementById('status');
        let currentTopic = 'science';
        let isLoading = false;

        const sources = {
            science: {
                // Wellcome Collection: Medicine, Science, and Life
                async fetch() {
                    const page = Math.floor(Math.random() * 50) + 1;
                    const res = await fetch(`https://api.wellcomecollection.org/catalogue/v2/works?pageSize=1&page=${page}&include=images`);
                    const d = await res.json();
                    const item = d.results[0];
                    if (!item || !item.thumbnail) return null;
                    return {
                        title: item.title,
                        img: item.thumbnail.url,
                        text: item.description || "Medical and scientific history record from the Wellcome archives.",
                        tag: "Wellcome Collection: Science & Life"
                    };
                }
            },
            history: {
                // Smithsonian: Open Access Natural History & Culture
                async fetch() {
                    const topics = ['natural history', 'fossils', 'minerals', 'photography'];
                    const q = topics[Math.floor(Math.random()*topics.length)];
                    // Use a random offset to find a unique item
                    const start = Math.floor(Math.random() * 100);
                    const res = await fetch(`https://collections.nmnh.si.edu/search/results.php?q=${q}&count=1&view=json&start=${start}`);
                    // Note: This is a simplified fetch; actual Smithsonian API often requires headers
                    // Replacing with a highly stable alternative if direct fetch fails:
                    const resAlt = await fetch(`https://api.artic.edu/api/v1/artworks/search?q=${q}&limit=1&fields=id,title,image_id,thumbnail`);
                    const d = await resAlt.json();
                    const item = d.data[0];
                    if (!item || !item.image_id) return null;
                    return {
                        title: item.title,
                        img: `https://www.artic.edu/iiif/2/${item.image_id}/full/843,/0/default.jpg`,
                        text: item.thumbnail?.alt_text || "Educational artifact from world history collections.",
                        tag: "Global History Archive"
                    };
                }
            },
            nasa: {
                // NASA Images Library (Stable Search API)
                async fetch() {
                    const keywords = ['nebula', 'planet', 'apollo', 'mars', 'galaxy'];
                    const q = keywords[Math.floor(Math.random()*keywords.length)];
                    const res = await fetch(`https://images-api.nasa.gov/search?q=${q}&media_type=image`);
                    const d = await res.json();
                    const items = d.collection.items;
                    const item = items[Math.floor(Math.random() * items.length)];
                    if (!item || !item.links || !item.links[0].href) return null;
                    return {
                        title: item.data[0].title,
                        img: item.links[0].href,
                        text: item.data[0].description || "No further description available from NASA metadata.",
                        tag: "NASA Image Repository"
                    };
                }
            }
        };

        async function createSlide() {
            if (isLoading) return;
            isLoading = true;
            status.style.display = 'block';

            try {
                let data = null;
                while (!data) { data = await sources[currentTopic].fetch(); }

                const section = document.createElement('section');
                section.innerHTML = `
                    <div class="glass-card">
                        <div class="img-container"><img src="${data.img}" loading="lazy"></div>
                        <div class="data-drawer">
                            <h2>${data.title}</h2>
                            <p class="tag">${data.tag}</p>
                            <p class="text">${data.text}</p>
                        </div>
                    </div>
                `;
                feed.appendChild(section);
            } catch (err) {
                console.warn("Retrying fetch...");
            } finally {
                isLoading = false;
                status.style.display = 'none';
            }
        }

        function switchTopic(topic, btn) {
            currentTopic = topic;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            feed.innerHTML = '';
            window.scrollTo(0, 0);
            init();
        }

        async function init() {
            for (let i = 0; i < 3; i++) await createSlide();
        }

        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 800) {
                createSlide();
            }
        });

        init();
    </script>
</body>
</html>
