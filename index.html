<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>NASA Space Swipe</title>
    <style>
        :root { --bg: #0b0d17; --card: #161b22; --text: #e6edf3; --accent: #4fc3f7; }
        
        body { 
            background-color: var(--bg); color: var(--text); 
            font-family: -apple-system, system-ui, sans-serif; 
            margin: 0; height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; overflow: hidden; 
            touch-action: none; 
        }
        
        #card-container { position: relative; width: 90vw; max-width: 400px; height: 620px; perspective: 1000px; }
        
        .card {
            position: absolute; width: 100%; height: 100%; background: var(--card);
            border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; padding: 15px; box-sizing: border-box;
            border: 1px solid #30363d; transition: transform 0.1s linear, opacity 0.3s ease;
            will-change: transform, opacity;
        }

        .img-container { width: 100%; height: 55%; border-radius: 16px; overflow: hidden; background: #000; position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .info { padding: 15px 5px; text-align: center; flex-grow: 1; overflow-y: auto; }
        .title { font-size: 1.1rem; font-weight: bold; color: var(--accent); margin-bottom: 5px; }
        .date { font-size: 0.8rem; opacity: 0.5; margin-bottom: 10px; }
        
        /* New Description Styling */
        .description { font-size: 0.85rem; line-height: 1.4; text-align: left; display: none; margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 10px; }

        .controls { display: flex; gap: 10px; margin-top: auto; }
        .btn { flex: 1; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-blue { background: #007bff; color: white; }
        .btn-gray { background: #30363d; color: white; }

        .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; position: absolute; top: 40%; left: 50%; margin: -20px 0 0 -20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div style="margin-bottom: 10px; font-size: 0.7rem; letter-spacing: 2px; opacity: 0.5;">SWIPE TO TRAVEL</div>

    <div id="card-container">
        <div id="space-card" class="card">
            <div id="loader" class="loader"></div>
            <div id="content" style="visibility:hidden; height: 100%; display: flex; flex-direction: column;">
                <div class="img-container">
                    <img id="space-img" src="" alt="Space">
                </div>
                <div class="info">
                    <div id="space-title" class="title">...</div>
                    <div id="space-date" class="date"></div>
                    <div id="space-desc" class="description"></div>
                    <div class="controls">
                        <button class="btn btn-gray" id="info-btn">More Info</button>
                        <button class="btn btn-blue" id="view-btn">Full Image</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const card = document.getElementById('space-card');
        const imgEl = document.getElementById('space-img');
        const titleEl = document.getElementById('space-title');
        const dateEl = document.getElementById('space-date');
        const descEl = document.getElementById('space-desc');
        const loader = document.getElementById('loader');
        const content = document.getElementById('content');
        const infoBtn = document.getElementById('info-btn');
        const viewBtn = document.getElementById('view-btn');

        let startX = 0, currentX = 0;

        function getRandomDate() {
            const start = new Date(2016, 0, 1);
            const end = new Date();
            return new Date(start.getTime() + Math.random() * (end.getTime() - start.getTime())).toISOString().split('T')[0];
        }

        async function fetchSpace() {
            loader.style.display = 'block';
            content.style.visibility = 'hidden';
            descEl.style.display = 'none'; // Reset description view
            infoBtn.innerText = "More Info";
            
            const url = `https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&date=${getRandomDate()}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                if(data.media_type !== 'image') return fetchSpace();

                imgEl.src = data.url;
                titleEl.innerText = data.title;
                dateEl.innerText = data.date;
                descEl.innerText = data.explanation;
                
                viewBtn.onclick = () => window.open(data.hdurl || data.url, '_blank');
                infoBtn.onclick = () => {
                    const isVisible = descEl.style.display === 'block';
                    descEl.style.display = isVisible ? 'none' : 'block';
                    infoBtn.innerText = isVisible ? "More Info" : "Hide Info";
                };

                imgEl.onload = () => {
                    loader.style.display = 'none';
                    content.style.visibility = 'visible';
                };
            } catch (err) { fetchSpace(); }
        }

        card.addEventListener('touchstart', e => { startX = e.touches[0].clientX; card.style.transition = 'none'; });

        card.addEventListener('touchmove', e => {
            currentX = e.touches[0].clientX - startX;
            card.style.transform = `translateX(${currentX}px) rotate(${currentX / 15}deg)`;
            card.style.opacity = 1 - (Math.abs(currentX) / 600); // Fades as you swipe
        });

        card.addEventListener('touchend', () => {
            if (Math.abs(currentX) > 100) {
                // Swipe & Fade out
                card.style.transition = 'transform 0.4s ease-in, opacity 0.4s ease-in';
                card.style.transform = `translateX(${currentX > 0 ? 500 : -500}px) rotate(${currentX / 5}deg)`;
                card.style.opacity = '0';
                
                setTimeout(() => {
                    fetchSpace();
                    card.style.transition = 'none';
                    card.style.transform = 'scale(0.95)';
                    card.style.opacity = '0';
                    setTimeout(() => {
                        card.style.transition = 'transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1), opacity 0.6s ease-out';
                        card.style.transform = 'scale(1)';
                        card.style.opacity = '1';
                    }, 50);
                }, 400);
            } else {
                card.style.transition = 'transform 0.3s ease-out, opacity 0.3s';
                card.style.transform = 'translateX(0) rotate(0)';
                card.style.opacity = '1';
            }
            currentX = 0;
        });

        fetchSpace();
    </script>
</body>
</html>
