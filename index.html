<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmos Infinity</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.08); --accent: #4fc3f7; }
        
        body, html {
            margin: 0; padding: 0; background: #000; height: 100vh;
            scroll-snap-type: y mandatory; overflow-y: scroll;
            -webkit-overflow-scrolling: touch; font-family: -apple-system, sans-serif; color: #fff;
        }

        /* Container for all the slides we will generate */
        #feed { width: 100%; }

        section { 
            height: 100vh; width: 100%; scroll-snap-align: start; 
            display: flex; align-items: center; justify-content: center; 
        }

        .glass-card { 
            width: 92vw; height: 86vh; background: var(--glass); 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 40px; border: 1px solid rgba(255,255,255,0.1); 
            overflow: hidden; display: flex; flex-direction: column; 
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
        }

        .img-container { 
            height: 50%; width: 100%; background: #000; 
            overflow: auto; display: flex; align-items: center; justify-content: center; 
        }

        .img-container img { max-width: 100%; height: auto; display: block; }

        .data-drawer { 
            flex: 1; padding: 25px; background: rgba(10, 10, 15, 0.85); 
            overflow-y: auto; border-top: 1px solid rgba(255,255,255,0.1);
        }

        h2 { margin: 0; font-size: 1.3rem; color: var(--accent); }
        .tag { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5; margin: 5px 0 12px; }
        .text { font-size: 0.9rem; line-height: 1.6; color: #ccc; }

        .loader-text { position: fixed; top: 50%; width: 100%; text-align: center; opacity: 0.5; font-size: 12px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="feed">
        </div>

    <div id="status" class="loader-text">INITIALIZING DEEP SPACE LINK...</div>

    <script>
        const feed = document.getElementById('feed');
        const status = document.getElementById('status');

        // Function to create a random date string
        function getRandomDate() {
            const start = new Date(2015, 0, 1).getTime();
            const end = new Date().getTime();
            return new Date(start + Math.random() * (end - start)).toISOString().split('T')[0];
        }

        // The "Factory" that builds a new slide
        async function createSlide() {
            try {
                const response = await fetch(`https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&date=${getRandomDate()}`);
                const data = await response.json();

                // If it's a video, skip and try again
                if (data.media_type !== 'image') return createSlide();

                // Create the HTML structure for the new slide
                const section = document.createElement('section');
                section.innerHTML = `
                    <div class="glass-card">
                        <div class="img-container">
                            <img src="${data.url}" alt="${data.title}">
                        </div>
                        <div class="data-drawer">
                            <h2>${data.title}</h2>
                            <p class="tag">${data.date} • NASA ARCHIVE</p>
                            <p class="text">${data.explanation}</p>
                        </div>
                    </div>
                `;
                feed.appendChild(section);
                status.style.display = 'none'; // Hide the loading text once first slide is in
            } catch (err) {
                console.error("NASA Link Interrupted");
            }
        }

        // INITIAL LOAD: Create 5 slides immediately
        async function init() {
            for (let i = 0; i < 5; i++) {
                await createSlide();
            }
        }

        // INFINITE SCROLL: When you get near the bottom, make 2 more slides
        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
                createSlide();
                createSlide();
            }
        });

        init();
    </script>
</body>
</html>
